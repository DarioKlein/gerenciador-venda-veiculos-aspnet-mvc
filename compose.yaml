services:
  gerenciadorvendaveiculos:
    image: gerenciadorvendaveiculos
    build:
      context: .
      dockerfile: GerenciadorVendaVeiculos/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=gerenciadorvendaveiculos;Username=postgres;Password=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gerenciadorvendaveiculos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: